services:
  app:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      - data:/data
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      OPENAI_BASE_URL: https://opencode.ai/zen/go/v1/chat/completions
      INFERENCE_TEXT_MODEL: deepseek-v4-flash
      INFERENCE_IMAGE_MODEL: deepseek-v4-flash-vision-exp
      INFERENCE_CONTEXT_LENGTH: 2048
      INFERENCE_JOB_TIMEOUT_SEC: 300
      CRAWLER_FULL_PAGE_SCREENSHOT: true
      CRAWLER_STORE_PDF: true
      OCR_LANGS: eng, chi_tra, chi_sim
      DATA_DIR: /data
      DISABLE_SIGNUPS: false
    depends_on:
      - meilisearch

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  tunnel:
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_EDGE_IP_VERSION=auto
    env_file:
      - cloudflared.env

volumes:
  meilisearch:
  data:
